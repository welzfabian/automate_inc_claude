[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "automate-inc"
version = "0.1.0"
description = "Automate Inc. - a satirical terminal management game about AI automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
automate-inc = "automate_inc.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automate_inc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The enums deliberately mix in `str`: they are serialised through `.value` into the
# save file, and switching them to `enum.StrEnum` would change what `str(member)`
# and f-strings produce. Not worth the risk for a style rule.
ignore = ["UP042"]
